# 파일 이름은 자유롭게 지정 가능 (예: ci.yml)

# 1. 언제 실행할지 정의
name: CI Pipeline
on:
  push:
    branches: [ main ]

# 2. 어떤 작업(job)을 할지 정의
jobs:
  build-and-test: # 잡(job)의 이름
    # 3. 어떤 환경(러너)에서 실행할지
    runs-on: ubuntu-latest

    # 4. 어떤 단계(step)를 실행할지
    steps:
      # (1) 마켓플레이스의 Action을 사용하여 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # (2) 빌드 스크립트 실행
      - name: Build project
        run: |
          echo "Building the project..."
          echo "Build complete."

      # (3) 테스트 스크립트 실행
      - name: Run tests
        run: echo "Testing the project..."
